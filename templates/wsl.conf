# /etc/wsl.conf - per-distribution WSL settings for X Linux.
# This file lives inside the WSL distribution (/etc/wsl.conf) and is applied
# on every start of this instance. Shipped as-is by build-rootfs.sh.
# Reference: https://learn.microsoft.com/en-us/windows/wsl/wsl-config
#
# X Linux for WSL is headless (no GUI, no Hyprland/compositor). Networking and
# interop come from WSL itself, so no NetworkManager/openssh is needed inside.

# Boot systemd as PID 1. Requires the Microsoft Store build of WSL
# (v0.67.6+) and Windows 11.
[boot]
systemd=true

# User used for new WSL sessions. Imported distributions always boot as root
# until you point "default" at a user that exists on the system (WSL refuses
# to start with a non-existent user). "root" is therefore the safe default for
# the imported rootfs; replace it with your username once you create it
# (xlnux/wsl-scripts does that for you).
[user]
default=root

# Interoperability with Windows: run Windows executables from Linux and append
# the Windows PATH.
[interop]
enabled=true
appendWindowsPath=true

# Let WSL manage /etc/hosts and /etc/resolv.conf for this instance.
[network]
generateHosts=true
generateResolvConf=true

# Keep the instance clock and timezone in sync with Windows.
[time]
useWindowsTimezone=true
